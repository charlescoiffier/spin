<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <title>SPIN — Parcours</title>
  </head>
  <body>
    <main id="app">
      <header>
        <strong>SPIN <small>Parcours</small></strong
        ><button
          id="panel-toggle"
          aria-expanded="true"
          aria-controls="debug race-ui editor-ui"
        >
          Masquer le panneau
        </button>
      </header>
      <section id="play" aria-label="Terrain de jeu">
        <div id="game"></div>
      </section>
      <aside
        class="side-panel"
        id="debug"
        aria-label="Laboratoire"
        hidden
      ></aside>
      <aside
        class="side-panel"
        id="race-ui"
        aria-label="Course et parcours"
        hidden
      ></aside>
      <aside
        class="side-panel"
        id="editor-ui"
        aria-label="Éditeur de parcours"
        hidden
      ></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
